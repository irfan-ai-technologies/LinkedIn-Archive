[project]
name = "linkedin-archive"
version = "0.1.0"
description = "Turn your LinkedIn posts into a searchable, categorized, static personal website."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "LinkedIn Archive contributors" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-slugify>=8.0",
    "python-frontmatter>=1.1",
    "bleach[css]>=6.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-bleach",
    "types-python-dateutil",
    "freezegun>=1.5",
    "respx>=0.21",
]

[project.scripts]
linkedin-archive = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/ingestion/sample_data.json", "app/site/templates/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
# E501: line length is handled by `ruff format`.
# B008: Typer/FastAPI require calling Argument()/Option()/Depends() in defaults.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
ignore_missing_imports = true
exclude = ["dist", "tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
